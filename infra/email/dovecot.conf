# Dovecot configuration for the Expathio mail server.
# Installed as /etc/dovecot/dovecot.conf by install.sh, which fills in the
# values marked "set by install.sh". Requires Dovecot 2.4.5 or newer.
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

protocols = imap lmtp
listen = *, ::

# Mailboxes: /var/mail/domains/<domain>/<user>/Maildir, all owned by the
# system user "vmail".
mail_driver = maildir
mail_home = /var/mail/domains/%{user | domain}/%{user | username}
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
# Only the vmail uid may own mail (set by install.sh from "id -u vmail").
first_valid_uid = 113
last_valid_uid = 113

# Accounts live in a flat file maintained by the expathio-mail tool.
auth_mechanisms = plain login
auth_allow_cleartext = no
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

# TLS is mandatory. install.sh generates a self-signed certificate when none
# is present; replace both files to use a CA-issued certificate.
ssl = required
ssl_server_cert_file = /etc/ssl/mail/cert.pem
ssl_server_key_file = /etc/ssl/mail/key.pem

# IMAP over implicit TLS only (993). Plain IMAP (143) is disabled.
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
  }
}

# Sockets used by Postfix: local delivery (LMTP) and SMTP authentication (SASL).
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

protocol lmtp {
  # Set by install.sh to postmaster@<domain>.
  postmaster_address = postmaster@expathio.com
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
