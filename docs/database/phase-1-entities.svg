<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Arial, Helvetica, sans-serif">
  <title>Expathio Phase 1 database entities and relations (PROPOSED, 2026-11-17)</title>
  <desc>Blue tables hold organization-owned data (organization_id required). Gray tables are global. Lines show foreign keys and cardinality (1 to many).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#ffffff"/>
  <text x="30" y="28" font-size="18" font-weight="bold" fill="#111">Phase 1 database: entities and relations</text>
  <text x="30" y="46" font-size="12" fill="#444">PROPOSED, revised 2026-11-17 (not approved). Blue = organization-owned, protected by row-level security. Gray = global.</text>

  <!-- Relation lines (drawn first so boxes sit on top) -->
  <!-- USER -> SESSION (USER top to SESSION bottom) -->
  <line x1="160" y1="200" x2="160" y2="140" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- USER -> ACCOUNT (USER bottom to ACCOUNT top) -->
  <line x1="160" y1="330" x2="160" y2="380" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- USER -> MEMBERSHIP (USER right to MEMBERSHIP left) -->
  <line x1="260" y1="265" x2="360" y2="265" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- ORGANIZATION -> MEMBERSHIP (ORGANIZATION bottom to MEMBERSHIP top) -->
  <line x1="470" y1="140" x2="470" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- ROLE -> MEMBERSHIP (ROLE left to MEMBERSHIP right) -->
  <line x1="660" y1="250" x2="580" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- ROLE -> ROLE_PERMISSION (ROLE bottom to ROLE_PERMISSION top) -->
  <line x1="760" y1="300" x2="760" y2="360" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- PERMISSION -> ROLE_PERMISSION (PERMISSION right to ROLE_PERMISSION left) -->
  <line x1="580" y1="430" x2="660" y2="430" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cardinality labels -->
  <text x="150" y="172" font-size="11" fill="#444">1 : many</text>
  <text x="166" y="362" font-size="11" fill="#444">1 : many</text>
  <text x="290" y="258" font-size="11" fill="#444">1 : many</text>
  <text x="478" y="172" font-size="11" fill="#444">1 : many</text>
  <text x="596" y="242" font-size="11" fill="#444">1 : many</text>
  <text x="770" y="332" font-size="11" fill="#444">1 : many</text>
  <text x="596" y="422" font-size="11" fill="#444">1 : many</text>

  <!-- SESSION (global, gray) -->
  <rect x="60" y="40" width="200" height="100" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <text x="72" y="62" font-size="14" font-weight="bold" fill="#111">session</text>
  <text x="72" y="82" font-size="11" fill="#222">id (PK, text)</text>
  <text x="72" y="98" font-size="11" fill="#222">token (unique)</text>
  <text x="72" y="114" font-size="11" fill="#222">expires_at (timestamptz)</text>
  <text x="72" y="130" font-size="11" fill="#222">user_id (FK to user)</text>

  <!-- USER (global, gray) -->
  <rect x="60" y="200" width="200" height="130" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <text x="72" y="222" font-size="14" font-weight="bold" fill="#111">user (account)</text>
  <text x="72" y="242" font-size="11" fill="#222">id (PK, text)</text>
  <text x="72" y="258" font-size="11" fill="#222">name, email (unique, lower case)</text>
  <text x="72" y="274" font-size="11" fill="#222">email_verified</text>
  <text x="72" y="290" font-size="11" fill="#222">simulated (test account flag)</text>
  <text x="72" y="306" font-size="11" fill="#222">created_at, updated_at</text>

  <!-- ACCOUNT / login method (global, gray) -->
  <rect x="60" y="380" width="200" height="120" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <text x="72" y="402" font-size="14" font-weight="bold" fill="#111">account (login method)</text>
  <text x="72" y="422" font-size="11" fill="#222">id (PK, text)</text>
  <text x="72" y="438" font-size="11" fill="#222">provider_id, account_id</text>
  <text x="72" y="454" font-size="11" fill="#222">user_id (FK to user)</text>
  <text x="72" y="470" font-size="11" fill="#222">password hash (never the password)</text>

  <!-- ORGANIZATION (organization-owned root, blue) -->
  <rect x="360" y="40" width="220" height="100" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="372" y="62" font-size="14" font-weight="bold" fill="#111">organizations</text>
  <text x="372" y="82" font-size="11" fill="#222">id (PK, uuid)</text>
  <text x="372" y="98" font-size="11" fill="#222">slug (unique), name</text>
  <text x="372" y="114" font-size="11" fill="#222">simulated (default true)</text>
  <text x="372" y="130" font-size="11" fill="#222">Phase 1: MONUMENT</text>

  <!-- MEMBERSHIP (organization-owned, blue) -->
  <rect x="360" y="200" width="220" height="150" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="372" y="222" font-size="14" font-weight="bold" fill="#111">memberships (history)</text>
  <text x="372" y="242" font-size="11" fill="#222">id (PK, uuid)</text>
  <text x="372" y="258" font-size="11" fill="#1d4ed8" font-weight="bold">organization_id (NOT NULL, RLS)</text>
  <text x="372" y="274" font-size="11" fill="#222">user_id (FK), role_key (FK)</text>
  <text x="372" y="290" font-size="11" fill="#222">started_at, ended_at (null = active)</text>
  <text x="372" y="306" font-size="11" fill="#222">unique active: (organization, user)</text>
  <text x="372" y="322" font-size="11" fill="#222">unique active: (organization, role), ADR 0007</text>
  <text x="372" y="338" font-size="11" fill="#222">rows are ended, never deleted</text>

  <!-- PERMISSION (global catalog, gray) -->
  <rect x="360" y="380" width="220" height="100" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <text x="372" y="402" font-size="14" font-weight="bold" fill="#111">permissions</text>
  <text x="372" y="422" font-size="11" fill="#222">id (PK, uuid)</text>
  <text x="372" y="438" font-size="11" fill="#222">resource, action</text>
  <text x="372" y="454" font-size="11" fill="#222">unique (resource, action)</text>
  <text x="372" y="470" font-size="11" fill="#222">action: read, change, request, decide</text>

  <!-- ROLE (global catalog, gray) -->
  <rect x="660" y="200" width="200" height="100" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <text x="672" y="222" font-size="14" font-weight="bold" fill="#111">roles</text>
  <text x="672" y="242" font-size="11" fill="#222">key (PK, text, stable)</text>
  <text x="672" y="258" font-size="11" fill="#222">title, description</text>
  <text x="672" y="274" font-size="11" fill="#222">Operations Assistant</text>
  <text x="672" y="290" font-size="11" fill="#222">+ 3 more (ADR 0027)</text>

  <!-- ROLE_PERMISSION (global catalog, gray) -->
  <rect x="660" y="360" width="200" height="100" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <text x="672" y="382" font-size="14" font-weight="bold" fill="#111">role_permissions</text>
  <text x="672" y="402" font-size="11" fill="#222">role_key (FK), permission_id (FK)</text>
  <text x="672" y="418" font-size="11" fill="#222">scope: organization, own, case</text>
  <text x="672" y="434" font-size="11" fill="#222">primary key (role, permission)</text>
  <text x="672" y="450" font-size="11" fill="#222">rows loaded from shared/access-rules.ts</text>

  <!-- Legend -->
  <rect x="660" y="500" width="18" height="14" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="686" y="512" font-size="12" fill="#222">organization-owned (organization_id required)</text>
  <rect x="660" y="524" width="18" height="14" fill="#eeeeee" stroke="#777"/>
  <text x="686" y="536" font-size="12" fill="#222">global (identity, sessions, reference data)</text>
  <text x="30" y="580" font-size="11" fill="#444">Source: docs/database/phase-1-database-architecture.md, section 4. Column lists are abbreviated.</text>
</svg>
