<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="Arial, Helvetica, sans-serif">
  <title>Expathio Phase 1 database entities and relations (PROPOSED, 2026-11-17)</title>
  <desc>Approved 2026-11-17 (Q-026). Blue tables hold organization-owned data (organization_id required, protected by row-level security). Gray tables are global. Lines show foreign keys and cardinality (1 to many).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="960" height="690" fill="#ffffff"/>
  <text x="30" y="28" font-size="18" font-weight="bold" fill="#111">Phase 1 database: entities and relations</text>
  <text x="30" y="48" font-size="12" fill="#444">APPROVED by the owner 2026-11-17 (Q-026). Blue = organization-owned, protected by row-level security. Gray = global.</text>

  <!-- Diagram area, shifted down so nothing sits under the heading -->
  <g transform="translate(0,60)">

    <!-- Relation lines (drawn first so boxes sit on top) -->
    <line x1="160" y1="200" x2="160" y2="140" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="160" y1="330" x2="160" y2="380" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="260" y1="265" x2="360" y2="265" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="485" y1="140" x2="485" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="700" y1="250" x2="610" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="810" y1="300" x2="810" y2="380" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="610" y1="435" x2="700" y2="435" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Cardinality labels -->
    <text x="150" y="172" font-size="11" fill="#444">1 : many</text>
    <text x="166" y="362" font-size="11" fill="#444">1 : many</text>
    <text x="290" y="258" font-size="11" fill="#444">1 : many</text>
    <text x="492" y="172" font-size="11" fill="#444">1 : many</text>
    <text x="620" y="242" font-size="11" fill="#444">1 : many</text>
    <text x="818" y="342" font-size="11" fill="#444">1 : many</text>
    <text x="620" y="428" font-size="11" fill="#444">1 : many</text>

    <!-- SESSION (global) -->
    <rect x="60" y="40" width="200" height="100" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
    <text x="72" y="62" font-size="14" font-weight="bold" fill="#111">session</text>
    <text x="72" y="82" font-size="11" fill="#222">id (PK, text)</text>
    <text x="72" y="98" font-size="11" fill="#222">token (unique)</text>
    <text x="72" y="114" font-size="11" fill="#222">expires_at (timestamptz)</text>
    <text x="72" y="130" font-size="11" fill="#222">user_id (FK to user)</text>

    <!-- USER (global) -->
    <rect x="60" y="200" width="200" height="130" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
    <text x="72" y="222" font-size="14" font-weight="bold" fill="#111">user (account)</text>
    <text x="72" y="242" font-size="11" fill="#222">id (PK, text)</text>
    <text x="72" y="258" font-size="11" fill="#222">name, email (unique, lower case)</text>
    <text x="72" y="274" font-size="11" fill="#222">email_verified</text>
    <text x="72" y="290" font-size="11" fill="#222">simulated (test account flag)</text>
    <text x="72" y="306" font-size="11" fill="#222">created_at, updated_at</text>

    <!-- ACCOUNT / login method (global) -->
    <rect x="60" y="380" width="200" height="120" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
    <text x="72" y="402" font-size="14" font-weight="bold" fill="#111">account (login method)</text>
    <text x="72" y="422" font-size="11" fill="#222">id (PK, text)</text>
    <text x="72" y="438" font-size="11" fill="#222">provider_id, account_id</text>
    <text x="72" y="454" font-size="11" fill="#222">user_id (FK to user)</text>
    <text x="72" y="470" font-size="11" fill="#222">password hash (never the password)</text>

    <!-- ORGANIZATIONS (organization-owned root) -->
    <rect x="360" y="40" width="250" height="100" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="372" y="62" font-size="14" font-weight="bold" fill="#111">organizations</text>
    <text x="372" y="82" font-size="11" fill="#222">id (PK, uuid)</text>
    <text x="372" y="98" font-size="11" fill="#222">slug (unique), name</text>
    <text x="372" y="114" font-size="11" fill="#222">simulated (default true)</text>
    <text x="372" y="130" font-size="11" fill="#222">Phase 1: MONUMENT</text>

    <!-- MEMBERSHIP (organization-owned, history kept) -->
    <rect x="360" y="200" width="250" height="165" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="372" y="222" font-size="14" font-weight="bold" fill="#111">memberships (history)</text>
    <text x="372" y="242" font-size="11" fill="#222">id (PK, uuid)</text>
    <text x="372" y="258" font-size="11" fill="#1d4ed8" font-weight="bold">organization_id (NOT NULL, RLS)</text>
    <text x="372" y="274" font-size="11" fill="#222">user_id (FK), role_key (FK)</text>
    <text x="372" y="290" font-size="11" fill="#222">started_at, ended_at (null = active)</text>
    <text x="372" y="306" font-size="11" fill="#222">one active membership per account</text>
    <text x="372" y="322" font-size="11" fill="#222">unique active: (organization, role)</text>
    <text x="372" y="338" font-size="11" fill="#222">one occupant per role (ADR 0007)</text>
    <text x="372" y="354" font-size="11" fill="#222">rows are ended, never deleted</text>

    <!-- PERMISSIONS (global catalog) -->
    <rect x="360" y="400" width="250" height="100" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
    <text x="372" y="422" font-size="14" font-weight="bold" fill="#111">permissions</text>
    <text x="372" y="440" font-size="11" fill="#222">id (PK, uuid)</text>
    <text x="372" y="456" font-size="11" fill="#222">resource, action</text>
    <text x="372" y="472" font-size="11" fill="#222">unique (resource, action)</text>
    <text x="372" y="488" font-size="11" fill="#222">action: read, change, request, decide</text>

    <!-- ROLES (global catalog) -->
    <rect x="700" y="200" width="220" height="100" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
    <text x="712" y="222" font-size="14" font-weight="bold" fill="#111">roles</text>
    <text x="712" y="242" font-size="11" fill="#222">key (PK, text, stable)</text>
    <text x="712" y="258" font-size="11" fill="#222">title, description</text>
    <text x="712" y="274" font-size="11" fill="#222">Operations Assistant</text>
    <text x="712" y="290" font-size="11" fill="#222">+ 3 more (ADR 0027)</text>

    <!-- ROLE_PERMISSIONS (global catalog) -->
    <rect x="700" y="380" width="220" height="110" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
    <text x="712" y="402" font-size="14" font-weight="bold" fill="#111">role_permissions</text>
    <text x="712" y="422" font-size="11" fill="#222">role_key (FK), permission_id (FK)</text>
    <text x="712" y="438" font-size="11" fill="#222">scope: organization, own, case</text>
    <text x="712" y="454" font-size="11" fill="#222">primary key (role, permission)</text>
    <text x="712" y="470" font-size="11" fill="#222">rows from shared/access-rules.ts</text>
  </g>

  <!-- Legend (below the diagram, inside the frame) -->
  <rect x="60" y="592" width="18" height="14" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="86" y="604" font-size="12" fill="#222">organization-owned (organization_id required, RLS)</text>
  <rect x="60" y="616" width="18" height="14" fill="#eeeeee" stroke="#777"/>
  <text x="86" y="628" font-size="12" fill="#222">global (identity, sessions, reference data)</text>
  <text x="30" y="670" font-size="11" fill="#444">Source: docs/database/phase-1-database-architecture.md, section 4. Column lists are abbreviated.</text>
</svg>
