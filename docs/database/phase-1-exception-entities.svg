<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Arial, Helvetica, sans-serif">
  <title>Expathio Phase 1 budget exception entities (ADR 0032 Amendment 2, PROPOSED, 2026-11-17)</title>
  <desc>Proposed tables for the budget exception flow. Blue = organization-owned. Gray = global (supervision). Not approved until the owner approves Amendment 2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="30" y="28" font-size="18" font-weight="bold" fill="#111">Phase 1 budget exception flow (ADR 0032, Amendment 2)</text>
  <text x="30" y="48" font-size="12" fill="#444">PROPOSED, not approved. Blue = organization-owned, append-only where noted. Gray = global supervision tables.</text>

  <!-- Relation lines (under the boxes) -->
  <!-- internal_actors -> approval_rules -->
  <line x1="160" y1="170" x2="160" y2="230" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- approval_rules -> decisions (elbow) -->
  <path d="M 260 290 L 380 290" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- requests -> decisions -->
  <line x1="520" y1="170" x2="520" y2="230" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- internal_actors -> decisions (elbow above) -->
  <path d="M 260 200 L 330 200 L 330 250 L 380 250" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- budget_limits -> decisions (elbow below) -->
  <path d="M 700 380 L 700 340 L 580 340 L 580 300" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- departments -> requests -->
  <line x1="800" y1="170" x2="800" y2="110" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DEPARTMENT (reference, from Amendment 1) -->
  <rect x="660" y="60" width="280" height="50" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="672" y="80" font-size="13" font-weight="bold" fill="#111">departments (Amendment 1)</text>
  <text x="672" y="98" font-size="11" fill="#222">requests point to a department</text>

  <!-- INTERNAL_ACTOR -->
  <rect x="40" y="80" width="260" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="52" y="102" font-size="14" font-weight="bold" fill="#111">internal_actors</text>
  <text x="52" y="122" font-size="11" fill="#222">id (PK, uuid), organization_id (RLS)</text>
  <text x="52" y="138" font-size="11" fill="#222">kind: simulated_manager</text>
  <text x="52" y="154" font-size="11" fill="#222">not a participant role, not AI (Q-048)</text>

  <!-- APPROVAL_RULE -->
  <rect x="40" y="230" width="260" height="120" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="52" y="252" font-size="14" font-weight="bold" fill="#111">approval_rules</text>
  <text x="52" y="272" font-size="11" fill="#222">actor_id (composite FK), action</text>
  <text x="52" y="288" font-size="11" fill="#222">max_amount_minor (above 0)</text>
  <text x="52" y="304" font-size="11" fill="#222">department_id (optional)</text>
  <text x="52" y="320" font-size="11" fill="#222">version, effective_from</text>
  <text x="52" y="336" font-size="11" font-weight="bold" fill="#1d4ed8">append-only, new version = new row</text>

  <!-- BUDGET_EXCEPTION_REQUEST -->
  <rect x="380" y="170" width="280" height="110" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="392" y="192" font-size="14" font-weight="bold" fill="#111">budget_exception_requests</text>
  <text x="392" y="212" font-size="11" fill="#222">department_id (composite FK)</text>
  <text x="392" y="228" font-size="11" fill="#222">amount_minor (above 0)</text>
  <text x="392" y="244" font-size="11" fill="#222">justification (not empty)</text>
  <text x="392" y="260" font-size="11" fill="#1d4ed8" font-weight="bold">append-only</text>

  <!-- BUDGET_EXCEPTION_DECISION -->
  <rect x="380" y="380" width="300" height="200" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="392" y="402" font-size="14" font-weight="bold" fill="#111">budget_exception_decisions</text>
  <text x="392" y="422" font-size="11" fill="#222">request_id (one per request)</text>
  <text x="392" y="438" font-size="11" fill="#222">outcome: approved or rejected</text>
  <text x="392" y="454" font-size="11" fill="#222">reason_code, rule_id, actor_id</text>
  <text x="392" y="470" font-size="11" fill="#222">budget_limit_id</text>
  <text x="392" y="486" font-size="11" fill="#222">snapshot: available, committed, limit</text>
  <text x="392" y="502" font-size="11" fill="#222">impact: available after decision</text>
  <text x="392" y="518" font-size="11" fill="#222">decided_at</text>
  <text x="392" y="560" font-size="11" font-weight="bold" fill="#1d4ed8">append-only, audited under the actor</text>

  <!-- BUDGET_LIMIT (reference, from Amendment 1) -->
  <rect x="660" y="380" width="260" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="672" y="402" font-size="13" font-weight="bold" fill="#111">budget_limits (Amendment 1)</text>
  <text x="672" y="422" font-size="11" fill="#222">limit in force on the decision date</text>
  <text x="672" y="438" font-size="11" fill="#222">period: open (Q-042)</text>

  <!-- GLOBAL: platform roles and supervision (no organization) -->
  <rect x="660" y="180" width="260" height="110" rx="4" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <text x="672" y="202" font-size="13" font-weight="bold" fill="#111">platform_roles (global)</text>
  <text x="672" y="222" font-size="11" fill="#222">user_id, role: owner or administrator</text>
  <text x="672" y="238" font-size="11" fill="#222">grant record (who grants: Q-050)</text>
  <text x="672" y="262" font-size="11" fill="#222">supervision_actions (global)</text>
  <text x="672" y="278" font-size="11" fill="#222">actor, action, target, time</text>

  <!-- Legend and footer -->
  <rect x="40" y="580" width="18" height="14" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="66" y="592" font-size="12" fill="#222">organization-owned (RLS)</text>
  <rect x="290" y="580" width="18" height="14" fill="#eeeeee" stroke="#777"/>
  <text x="316" y="592" font-size="12" fill="#222">global (supervision, no organization)</text>
  <text x="30" y="612" font-size="11" fill="#444">Source: docs/decisions/0032-phase-1-database-architecture.md, Amendment 2 (PROPOSED). Column lists are abbreviated.</text>
</svg>
